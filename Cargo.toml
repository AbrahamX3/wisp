[package]
name = "wisp"
version = "0.2.0"
edition = "2021"
description = "Local PHP development for Windows: nginx + PHP sites on .test domains with trusted HTTPS"
license = "MIT"
authors = ["AbrahamX3"]
repository = "https://github.com/AbrahamX3/wisp"
build = "build.rs"

[dependencies]
gpui-kit = "0.7.3"
# System tray for "run in background". Purpose-built for GPUI: tray events are
# posted onto GPUI's own foreground executor rather than a second event loop.
# The `gpui-kit` feature selects the `gpui-pre` backend we already depend on.
gpui-tray = { version = "0.1", default-features = false, features = ["gpui-kit", "menu-state"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
schemars = { version = "1", default-features = false, features = ["std", "indexmap2", "derive"] }
serde_json = "1"
thiserror = "2"
# Self-update from GitHub Releases (see .github/workflows/release.yml).
self_update = { version = "1.3", default-features = false, features = [
    "ureq",
    "rustls",
    "github",
    "archive-zip",
    "compression-zip-deflate",
    "checksums",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
rcgen = { version = "0.14.10", features = ["x509-parser"] }
rfd = "0.17.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
x509-parser = "0.18"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }

[target.'cfg(windows)'.dependencies]
# The per-user "start with Windows" Run entry.
winreg = "0.56"
# Raw bindings, used only where no safe wrapper exists: the single-instance
# mutex and showing/hiding our own window.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
runas = "1.2.0"

[lints.rust]
# Safe Rust throughout, except for a few `#[expect(unsafe_code)]` call sites
# that reach into Win32 directly (see `platform.rs`).
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = 10 }

[build-dependencies]
winresource = "0.1"
# Rasterises assets/icon.svg into the .ico and tray pixels at build time, so the
# icon has a single source of truth and no generated binaries are committed.
resvg = "0.45"

# Keep framework dependencies optimized in Debug so the app stays responsive
# while we iterate. This does not make compilation faster.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
