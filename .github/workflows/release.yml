name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the release notes are built from the commits
          # between the previous tag and this one.
          fetch-depth: 0

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      # The asset name must contain the target triple: the in-app updater
      # (self_update) matches release assets by looking for the target string,
      # and extracts `wisp.exe` from the archive root.
      - name: Package portable archive
        shell: pwsh
        run: |
          $target = "x86_64-pc-windows-msvc"
          $asset = "wisp-$target.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/wisp.exe -DestinationPath "dist/$asset" -Force

      # Inno Setup needs a file path for SetupIconFile; the icon is generated by
      # build.rs into the cargo OUT_DIR, so copy it beside the .iss first.
      - name: Export app icon
        shell: pwsh
        run: ./scripts/export-icon.ps1 -Profile release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Output "Building installer for version $version"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\wisp.iss

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File | Where-Object { $_.Name -notlike "*.sha256" -and $_.Name -ne "release-notes.md" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content dist/SHA256SUMS -Encoding ascii
          Get-Content dist/SHA256SUMS

      - name: Release notes
        shell: pwsh
        run: ./scripts/release-notes.ps1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wisp-x86_64-pc-windows-msvc.zip
            dist/Wisp-Setup-*.exe
            dist/SHA256SUMS
          # Generated from Conventional Commits by scripts/release-notes.ps1
          # (GitHub's own generator only lists pull requests).
          body_path: dist/release-notes.md
